name: EZTakeoff Validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Emit dependency lock for review
        run: node -e "process.stdout.write('EZ_LOCK_START'+require('fs').readFileSync('package-lock.json').toString('base64')+'EZ_LOCK_END')"
      - run: npm test
      - run: npm run build
