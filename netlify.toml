[build]
  command = "npm run build >/tmp/ez-test-compile.txt 2>&1; status=$?; [ $status -eq 0 ] && exit 0; n=0; grep -q 'ConsultationDeckFinishes' /tmp/ez-test-compile.txt && n=$((n+1)); grep -q 'ManufacturerDeck3D' /tmp/ez-test-compile.txt && n=$((n+2)); grep -q 'visualGeometry' /tmp/ez-test-compile.txt && n=$((n+4)); grep -q 'RenaissanceExtrusions' /tmp/ez-test-compile.txt && n=$((n+8)); grep -q 'RenaissanceCover3D' /tmp/ez-test-compile.txt && n=$((n+16)); grep -q 'DeckStairAssembly3D' /tmp/ez-test-compile.txt && n=$((n+32)); grep -q 'estimate.ts' /tmp/ez-test-compile.txt && n=$((n+64)); [ $n -eq 0 ] && exit 99; exit $((n+10))" # TEMPORARY: compile-error file classifier, restore strict gate before release
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
